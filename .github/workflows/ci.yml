name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: gofmt
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "gofmt issues:"; gofmt -l .
            exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: build
        run: go build ./...
      - name: docker build
        run: docker build -t device-mock:ci .
      - name: docker smoke test
        run: |
          docker run -d --name dm -p 8080:8080 -p 9000:9000 device-mock:ci
          for i in $(seq 1 20); do curl -sf localhost:8080/healthz && break; sleep 1; done
          curl -sf localhost:8080/healthz
          python3 -c "import socket,time; s=socket.create_connection(('localhost',9000)); s.sendall(b'{\"id\":\"1\",\"method\":\"ping\"}\\n'); time.sleep(0.5); s.settimeout(2); print(s.recv(100).decode()); s.close()"
          docker rm -f dm
